name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validar el catálogo de evaluaciones
        run: |
          python3 skills/feature-stages/scripts/validate_skill_evals.py
          python3 skills/feature-stages/scripts/test_skill_evals.py
      - name: Ejecutar las suites de gate
        run: |
          python3 skills/feature-stages/scripts/test_next_step.py
          python3 skills/feature-stages/scripts/test_blockers.py
          python3 skills/feature-stages/scripts/test_tasks.py
          python3 skills/feature-stages/scripts/test_snapshot.py
          python3 skills/feature-stages/scripts/test_diff_scope.py
          python3 skills/feature-stages/scripts/test_expres.py
          python3 skills/feature-stages/scripts/test_evidence.py
          python3 skills/feature-stages/scripts/test_preflight.py
      - name: Verificar que doctor rechaza un árbol incoherente
        run: |
          if python3 skills/feature-stages/scripts/doctor.py skills/feature-stages/evals/fixtures/inconsistente; then
            echo 'doctor aceptó un índice cerrado sin veredicto: el gate está roto' >&2
            exit 1
          fi
          if python3 skills/feature-stages/scripts/doctor.py skills/feature-stages/evals/fixtures/doctor-estructural; then
            echo 'doctor aceptó etapas sin lista, sin auditoría o con deltas mal formados: el gate está roto' >&2
            exit 1
          fi
          if python3 skills/feature-stages/scripts/doctor.py skills/feature-stages/evals/fixtures/huerfana; then
            echo 'doctor aceptó una carpeta de etapa sin fila en el índice: el gate está roto' >&2
            exit 1
          fi
      - name: Verificar que doctor acepta un árbol coherente
        run: python3 skills/feature-stages/scripts/doctor.py skills/feature-stages/evals/fixtures/transiciones
      - name: Compilar scripts
        run: python3 -m py_compile skills/feature-stages/scripts/*.py
      - name: Comprobar ruido en el diff
        run: git diff --check
