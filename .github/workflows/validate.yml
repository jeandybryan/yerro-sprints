name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validar evals de skills
        run: python3 skills/feature-stages/scripts/validate_skill_evals.py
      - name: Validar fixture de etapa válida
        run: |
          python3 skills/feature-stages/scripts/validate_stage.py skills/feature-stages/evals/fixtures/valid-stage --strict
          python3 skills/feature-stages/scripts/validate_stage.py skills/feature-stages/evals/fixtures/index-estado/03-activa --strict
          python3 skills/feature-stages/scripts/validate_stage.py skills/feature-stages/evals/fixtures/index-estado/05-hecha --strict
      - name: Verificar que la fixture negativa falla
        run: |
          if python3 skills/feature-stages/scripts/validate_stage.py skills/feature-stages/evals/fixtures/closed-without-task --strict; then
            echo 'La fixture negativa pasó: el gate está roto' >&2
            exit 1
          fi
          if python3 skills/feature-stages/scripts/validate_stage.py skills/feature-stages/evals/fixtures/index-estado/04-etapa --strict; then
            echo 'El índice cerrado pasó sin veredicto coincide: el gate está roto' >&2
            exit 1
          fi
          fixture=skills/feature-stages/evals/fixtures/ca-tipo
          expected='CA-05 no declara tipo condición de salida/invariante acumulado'
          out=$(python3 skills/feature-stages/scripts/validate_stage.py "$fixture")
          status=$?
          if [ "$status" -ne 0 ]; then
            echo 'ca-tipo sin --strict no debe fallar' >&2
            printf '%s\n' "$out" >&2
            exit 1
          fi
          warns=$(printf '%s\n' "$out" | grep 'no declara tipo' || true)
          if [ "$warns" != "WARN: $expected" ]; then
            echo 'ca-tipo avisó un tipo distinto del CA sin marcador' >&2
            printf '%s\n' "$warns" >&2
            exit 1
          fi
          if strict_out=$(python3 skills/feature-stages/scripts/validate_stage.py "$fixture" --strict); then
            echo 'ca-tipo con --strict pasó: el gate está roto' >&2
            exit 1
          fi
          errors=$(printf '%s\n' "$strict_out" | grep '^ERROR:' || true)
          if [ "$errors" != "ERROR: $expected" ]; then
            echo 'ca-tipo con --strict falló por otro motivo' >&2
            printf '%s\n' "$errors" >&2
            exit 1
          fi
      - name: Compilar scripts
        run: python3 -m py_compile skills/feature-stages/scripts/*.py
      - name: Comprobar ruido en el diff
        run: git diff --check